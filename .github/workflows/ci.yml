name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests (offline, fixture data only)
        run: |
          set -o pipefail
          uv run pytest -m "not network" -rfE --tb=line 2>&1 | tee pytest.log
      - name: Report failing tests as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR)|^E |Error:" pytest.log | head -30 | sed 's/^/::error::/'
