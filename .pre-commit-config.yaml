repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pytest
        name: pytest (offline)
        entry: uv run pytest -m "not network" -x
        language: system
        pass_filenames: false
        stages: [pre-push]
